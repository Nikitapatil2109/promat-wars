name: EcoMind AI Enterprise CI & Security Automation

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  audit-and-test:
    name: Security Scan, Type Check & Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Analysis & Type Checking
        run: npm run lint

      - name: Automated Security & Regression Suite
        run: npm run test

      - name: Production Build Verification
        run: npm run build
